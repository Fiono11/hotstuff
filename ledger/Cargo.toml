[package]
name = "ledger"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
store = { path = "../store" }
types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
tokio = { version = "1.3.0", features = ["sync", "macros", "rt"] }
log = "0.4"
thiserror = "1.0"
ed25519-dalek = { version = "2.2.0", features = ["digest"] }

