[package]
name = "ledger"
version = "0.1.0"
authors = ["Alberto Sonnino <asonnino@fb.com>"]
edition = "2018"

[dependencies]
tokio = { version = "1.5.0", features = ["sync", "rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
log = "0.4.14"

crypto = { path = "../crypto" }
store = { path = "../store" }
mempool = { path = "../mempool" }
consensus = { path = "../consensus" }

[dev-dependencies]
rand = "0.7.3"
env_logger = "0.9.0"

