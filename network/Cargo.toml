[package]
name = "network"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "net", "sync", "macros", "time"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
thiserror = "2.0.17"
bytes = "1.11.0"
log = "0.4.29"
futures = "0.3.31"
rand = { version = "0.9.2", features = ["small_rng"] }
async-trait = "0.1.89"

[dev-dependencies]
bincode = { version = "2.0.1", features = ["serde"] }