[package]
name = "consensus"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "time", "macros", "sync"] }
ed25519-dalek = "2.2.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
bytes = "1.11.0"
bincode = { version = "2.0.1", features = ["serde"] }
futures = "0.3.31"
async-recursion = "1.1.1"
base64 = "0.22.1"
async-trait = "0.1.89"

store = { path = "../store" }
types = { path = "../types" }
network = { path = "../network" }
mempool = { path = "../mempool" }
ledger = { path = "../ledger" }

[dev-dependencies]
tokio-util = { version = "0.7.17", features= ["codec"] }
rand = "0.9.2"

[features]
benchmark = []