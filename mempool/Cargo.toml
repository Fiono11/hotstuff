[package]
name = "mempool"
version = "0.1.0"
authors = ["Alberto Sonnino <asonnino@fb.com>"]
edition = "2018"

[dependencies]
tokio = { version = "1.5.0", features = ["sync", "rt", "macros"] }
ed25519-dalek = { version = "2.2.0", features = ["digest"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.0.1"
log = "0.4.14"
bincode = { version = "2.0.1", features = ["serde"] }
futures = "0.3.14"
async-trait = "0.1.50"

crypto = { path = "../crypto" }
store = { path = "../store" }
network = { path = "../network" }

[dev-dependencies]
tokio-util = { version = "0.7.3", features= ["codec"] }
rand = "0.7.3"

[features]
benchmark = []
