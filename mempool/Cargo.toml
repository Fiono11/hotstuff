[package]
name = "mempool"
version = "0.1.0"
authors = ["Alberto Sonnino <asonnino@fb.com>"]
edition = "2018"

[dependencies]
tokio = { version = "1.48.0", features = ["sync", "rt", "macros"] }
ed25519-dalek = { version = "2.2.0", features = ["digest"] }
serde = { version = "1.0.228", features = ["derive"] }
bytes = "1.11.0"
log = "0.4.29"
bincode = { version = "2.0.1", features = ["serde"] }
futures = "0.3.31"
async-trait = "0.1.89"

types = { path = "../types" }
store = { path = "../store" }
network = { path = "../network" }

[dev-dependencies]
tokio-util = { version = "0.7.17", features= ["codec"] }
rand = "0.9.2"

[features]
benchmark = []
